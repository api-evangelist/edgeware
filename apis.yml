name: Edgeware
description: 'Edgeware AB was a Swedish video-delivery technology company founded in
  2004 and headquartered in Stockholm, known for its TV CDN, origin and media server,
  and streaming video-delivery products used by telecom operators and broadcasters
  to run OTT and IPTV services. Backed by Creandum, it listed on Nasdaq Stockholm in
  2016 and was acquired by Agile Content (Agile Content S.A.) in 2020. The Edgeware
  brand has since been consolidated into AgileTV: edgeware.tv now redirects to
  agiletv.com/edgeware/, and its developer/technical documentation lives under
  docs.agilecontent.com (AgileTV Origin & Media Server, CDN Solutions, Subtitling).
  Edgeware no longer operates as an independent company or publishes an independent
  developer API surface.'
